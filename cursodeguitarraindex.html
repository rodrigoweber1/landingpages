<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#FFFFFF}
body{margin:0;background:#FFFFFF;overscroll-behavior-y:none}
#side{display:none}
#stage{display:block}
#app{width:390px;margin:0 auto;zoom:var(--z,1);background:#FFFFFF;min-height:var(--mh,100vh);box-shadow:0 0 0 1px #E6E6E6}
@media (min-width:900px){
body{display:grid;grid-template-columns:320px minmax(0,1fr);align-items:start}
#side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-sizing:border-box;background:#FFFFFF;border-right:1px solid #E6E6E6;font-family:'Roboto',system-ui,sans-serif;color:#121212}
#stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;min-width:0}
#app{width:var(--aw,900px);zoom:1;margin:0;border-radius:14px;overflow:hidden;overflow:clip;box-shadow:0 1px 3px rgba(26,20,16,.12),0 8px 28px rgba(26,20,16,.10)}
.sd-head{padding:20px 20px 12px;display:flex;flex-direction:column;gap:6px}
.sd-logo{display:flex;align-items:center;gap:8px}.sd-head img{height:60px;width:auto;align-self:flex-start}
.sd-head a.home{font-size:13px;font-weight:500;color:#B3121A}
.sd-nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.sd-nav details{border-top:1px solid #E6E6E6}
.sd-nav summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 8px;font-family:'Archivo Black','Roboto',sans-serif;font-size:13px;line-height:18px;letter-spacing:.01em}
.sd-nav summary::-webkit-details-marker{display:none}
.sd-nav summary .n{flex:none;width:22px;height:22px;border-radius:250px;background:#FFF1CC;color:#B3121A;font-family:'Roboto',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sd-nav summary .chev{margin-left:auto;transition:transform .15s}
.sd-nav details[open] summary .chev{transform:rotate(180deg)}
.sd-nav a.it{display:block;padding:8px 8px 8px 38px;margin:1px 0;border-radius:6px;font-size:14px;line-height:20px;color:#121212;border-left:3px solid transparent}
.sd-nav a.it:hover{background:#F2F2F2}
.sd-nav a.it.on{background:#FFF1CC;border-left-color:#E31B23;font-weight:700}
.sd-foot{padding:12px 16px 16px;border-top:1px solid #E6E6E6;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sd-foot a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid #D9D9D9;border-radius:8px;background:#FFFFFF;min-height:52px;box-sizing:border-box;justify-content:center}
.sd-foot a.next{text-align:right}
.sd-foot a small{font-size:11px;line-height:14px;color:#5A5A5A}
.sd-foot a span{font-size:13px;line-height:17px;font-weight:500;color:#121212}
.sd-foot a.off{opacity:.4;pointer-events:none}
.sd-key{grid-column:1/3;font-size:11px;line-height:14px;color:#5A5A5A;text-align:center}
}
@media (min-width:900px){
body.home{grid-template-columns:minmax(0,1fr)}
body.home #side{display:none}
.sd-tabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;border-radius:8px;background:#E9E9E9;margin-top:4px}
.sd-tabs a{text-align:center;padding:9px 6px;border-radius:6px;font-size:13px;line-height:16px;font-weight:700;color:#3A3A3A}
.sd-tabs a.on{background:#FFFFFF;color:#B3121A;box-shadow:0 1px 2px rgba(26,20,16,.12)}
#app main{padding-left:48px!important;padding-right:48px!important}
#app main p{font-size:15px!important;line-height:23px!important}
#app header{padding-left:16px!important;padding-right:16px!important}
}
a{text-decoration:none;touch-action:manipulation}
a:hover{text-decoration:none}
a.cta:hover{background:#B3121A}
button{font-family:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid #E31B23;outline-offset:2px}
#app>div{padding-bottom:env(safe-area-inset-bottom)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

let currentKey = null;
function route() {
