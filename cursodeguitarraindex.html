<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="format-detection" content="telephone=no">

<title>La Caña · Aprende guitarra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#F4EDDD}
body{margin:0;background:#F4EDDD;overscroll-behavior-y:none}
#side{display:none}
#stage{display:block}
#app{width:390px;margin:0 auto;zoom:var(--z,1);background:#FFFFFF;min-height:var(--mh,100vh);box-shadow:0 0 0 1px #E9E0CC}
@media (min-width:900px){
body{display:grid;grid-template-columns:320px minmax(0,1fr);align-items:start}
#side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-sizing:border-box;background:#FAF5E9;border-right:1px solid #E9E0CC;font-family:'Roboto',system-ui,sans-serif;color:#1A1410}
#stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box;min-width:0}
#app{width:var(--aw,900px);zoom:1;margin:0;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(26,20,16,.12),0 8px 28px rgba(26,20,16,.10)}
.sd-head{padding:20px 20px 12px;display:flex;flex-direction:column;gap:6px}
.sd-head img{height:44px;width:auto;align-self:flex-start}
.sd-head a.home{font-size:13px;font-weight:500;color:#9E2412}
.sd-nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.sd-nav details{border-top:1px solid #E9E0CC}
.sd-nav summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 8px;font-family:'Archivo Black','Roboto',sans-serif;font-size:13px;line-height:18px;letter-spacing:.01em}
.sd-nav summary::-webkit-details-marker{display:none}
.sd-nav summary .n{flex:none;width:22px;height:22px;border-radius:250px;background:#FEF2DB;color:#9E2412;font-family:'Roboto',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sd-nav summary .chev{margin-left:auto;transition:transform .15s}
.sd-nav details[open] summary .chev{transform:rotate(180deg)}
.sd-nav a.it{display:block;padding:8px 8px 8px 38px;margin:1px 0;border-radius:6px;font-size:14px;line-height:20px;color:#1A1410;border-left:3px solid transparent}
.sd-nav a.it:hover{background:#F4EDDD}
.sd-nav a.it.on{background:#FEF2DB;border-left-color:#C8321C;font-weight:700}
.sd-foot{padding:12px 16px 16px;border-top:1px solid #E9E0CC;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sd-foot a{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid #D3C7AE;border-radius:8px;background:#FFFFFF;min-height:52px;box-sizing:border-box;justify-content:center}
.sd-foot a.next{text-align:right}
.sd-foot a small{font-size:11px;line-height:14px;color:#6B5F52}
.sd-foot a span{font-size:13px;line-height:17px;font-weight:500;color:#1A1410}
.sd-foot a.off{opacity:.4;pointer-events:none}
.sd-key{grid-column:1/3;font-size:11px;line-height:14px;color:#6B5F52;text-align:center}
}
@media (min-width:900px){
#app main{padding-left:48px!important;padding-right:48px!important}
#app main p{font-size:15px!important;line-height:23px!important}
#app header{padding-left:16px!important;padding-right:16px!important}
}
a{text-decoration:none;touch-action:manipulation}
a:hover{text-decoration:none}
a.cta:hover{background:#9E2412}
button{font-family:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid #C8321C;outline-offset:2px}
#app>div{padding-bottom:env(safe-area-inset-bottom)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  if (document.documentElement.clientWidth < DESK) return;
  app.querySelectorAll('[style*="position: relative"]').forEach((el) => {
    if (el.style.width !== '342px' || el.querySelector('svg')) return;
    const par = el.parentElement;
    const cp = getComputedStyle(par);
    const Wt = Math.min(880, par.clientWidth - px(cp.paddingLeft) - px(cp.paddingRight));
    try { reflowBoard(el, name, Wt); } catch (e) { if (window.console) console.warn('reflow', name, e); }
  });
  deskSvg(name);
  if (name === 'Anatomia') deskAnat();
  app.querySelectorAll('[style*="grid-template-columns"]').forEach((g) => {
    if (g.children.length === 12 && /repeat\(6/.test(g.style.gridTemplateColumns)) g.style.gridTemplateColumns = 'repeat(12, minmax(0, 1fr))';
  });
}

// ---------- router ----------
const app = document.getElementById('app');
let current = null;
let currentName = null;

function unmount() {
  if (current) {
    try { if (current.componentWillUnmount) current.componentWillUnmount(); } catch (e) {}
    current.__render = null;
  }
  current = null;
}

function mount(name) {
  unmount();
  const Cmp = C[name](DCLogic);
  const inst = new Cmp({});
  currentName = name;
  current = inst;
  const render = () => {
    const y = window.scrollY;
    const vals = inst.renderVals();
    const frag = document.createDocumentFragment();
    const tpl = template(name);
    for (let c = tpl.firstChild; c; c = c.nextSibling) build(c, vals, frag);
    app.replaceChildren(frag);
    const l = inst.state && inst.state.lang;
    if (l) document.documentElement.lang = l;
    const ti = vals.t && (vals.t.title || vals.t.h1);
    document.title = ti ? 'La Caña · ' + ti : 'La Caña · Guitarra';
    deskReflow(name);
    renderSide(name, l || 'es');
    if (render.first) { render.first = false; } else { window.scrollTo(0, y); }
  };
  render.first = true;
  inst.__render = render; window.__rerender = render;
  render();
  window.scrollTo(0, 0);
  try { if (inst.componentDidMount) inst.componentDidMount(); } catch (e) {}
}

function route() {
  let name = (location.hash || '').replace(/^#\/?/, '');
  if (!C[name]) name = 'Main';
  if (name !== currentName) mount(name);
}
window.addEventListener('hashchange', route);
route();
})();
</script>
